<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hobo</title>
  <style>
    html,body,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    ruffle-player{display:block;width:100%;height:100%}
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", letterbox: "fullscreen" };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    addEventListener("load", () => {
      const player = RufflePlayer.newest().createPlayer();
      document.getElementById("game").appendChild(player);
      player.load("https://cdn.jsdelivr.net/gh/BinBashBanana/gstore@master/hobo.swf");
    });
  </script>
</body>
</html>
