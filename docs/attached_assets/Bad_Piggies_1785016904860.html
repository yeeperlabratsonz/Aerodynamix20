<!DOCTYPE html>
<html lang="en-us">

<head>
	<base href="https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/badpiggies/">
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Unity WebGL Player | Bad Piggies</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<script src="Build/UnityLoader.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #000;
		}
		.webgl-content {
			width: 100%;
			height: 100%;
		}
		#gameContainer {
			width: 100vw;
			height: 100vh;
		}
	</style>
	<script>
		function hideOverlay() {
			var overlay = document.getElementById('loading-overlay');
			if (overlay) overlay.style.display = 'none';
		}
		function UnityProgress(gameInstance, progress) {
			if (progress === 1) hideOverlay();
		}
		var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Bad Piggies.json", {
			onProgress: UnityProgress,
			Module: {
				onRuntimeInitialized: hideOverlay
			}
		});
		// Fallback: remove the overlay after 15 seconds so the game isn't blocked forever
		setTimeout(hideOverlay, 15000);
	</script>
</head>

<body style="background-color:black;">
	<div id="loading-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999;"></div>
	<div class="webgl-content">
		<div id="gameContainer"></div>
	</div>
</body>

</html>
