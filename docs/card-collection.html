<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Card Collection - Aerodynamix</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="theme.js"></script>
  <script src="discs.js" defer></script>
  <style>
    .collection-page { min-height:100vh; padding:9vw 3.5vw 140px; color:#fff; background:radial-gradient(circle at 50% 0%,rgba(44,127,252,.14),transparent 34rem); }
    .collection-heading,.collection-section { max-width:1380px; margin:0 auto 2rem; }
    .collection-heading { padding:2.4rem 3rem; border:1px solid rgba(255,255,255,.12); border-radius:24px; background:linear-gradient(120deg,rgba(14,25,50,.96),rgba(10,14,25,.9)); }
    .collection-heading h1 { margin:0 0 .5rem; font-size:clamp(2.2rem,4vw,4rem); letter-spacing:-.04em; }
    .collection-heading p { margin:0; color:#aebbd0; line-height:1.6; }
    .collection-meta { display:flex; flex-wrap:wrap; gap:.65rem; margin-top:1.2rem; }
    .collection-stat { padding:.55rem .8rem; border:1px solid rgba(130,183,255,.2); border-radius:999px; color:#bcd7ff; background:rgba(44,127,252,.1); font-size:.75rem; font-weight:700; }
    .collection-section h2 { margin:0 0 1rem; font-size:1.35rem; }
    .collection-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem; }
    .collection-card { overflow:hidden; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); border-radius:15px; background:rgba(14,20,34,.92); box-shadow:0 12px 28px #0005; }
    .collection-card-art { aspect-ratio:1.35; background:#080c16; }
    .collection-card-art img { width:100%; height:100%; object-fit:cover; }
    .collection-card-body { padding:.85rem; }
    .collection-card h3 { margin:0 0 .35rem; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .collection-rarity { color:var(--accent); font-size:.65rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .collection-card small { display:block; margin-top:.35rem; color:#8793a8; }
    .sell-card { width:100%; margin-top:.75rem; padding:.55rem; border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); border-radius:8px; color:#fff; background:rgba(255,255,255,.07); cursor:pointer; font-weight:700; }
    .sell-card:hover { background:rgba(255,255,255,.14); }
    .empty-collection { padding:3rem; border:1px dashed #56708f; border-radius:16px; color:#9eabc0; text-align:center; }
    @media (max-width:700px) { .collection-page { padding:22vw 1rem 100px; } .collection-heading { padding:1.5rem; } }
  </style>
</head>
<body>
  <nav>
    <img src="images/logo.gif" alt="logo" onclick="window.location='index.html'">
    <h1><span class="logo-a" id="logo-a">A</span>ERODYNAMIX</h1>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:.4vw;">
      <a href="index.html">Games</a>
      <a href="shop.html">Shop</a>
      <a href="card-collection.html" style="background:#fff;color:#000;">Card Collection</a>
      <a href="media-player.html">Media Player</a>
      <a href="dynamix-connect.html">Connect</a>
    </div>
    <a href="colors.html">Settings</a>
  </nav>
  <main class="collection-page">
    <header class="collection-heading">
      <h1>Card Collection</h1>
      <p>Every Aerodynamix card you own, including duplicates. Sell individual cards for Dynamix tokens whenever you want.</p>
      <div class="collection-meta"><span class="collection-stat" id="card-count">0 cards</span><span class="collection-stat" id="token-count">— tokens</span></div>
    </header>
    <section class="collection-section">
      <h2>Your cards</h2>
      <div class="collection-grid" id="collection-grid"><div class="empty-collection">Loading your collection…</div></div>
    </section>
  </main>
  <script src="card-collection.js"></script>
  <script src="bubble-overlay.js"></script>
  <script src="snow-overlay.js"></script>
</body>
</html>
