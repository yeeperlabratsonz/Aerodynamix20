<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied · Aerodynamix</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; color:#fff; background:#050505; }
    body::before, body::after { content:""; position:fixed; left:0; right:0; height:14px; background:repeating-linear-gradient(135deg,#d71935 0 18px,#070707 18px 36px); }
    body::before { top:0; } body::after { bottom:0; }
    .ban-card { width:min(100%,690px); overflow:hidden; border:3px solid #d71935; background:#111; box-shadow:18px 18px 0 #560b16, 0 0 0 10px #050505, 0 30px 80px #000; text-align:center; }
    .ban-card::before { content:"DYNAMIX SECURITY"; display:block; padding:14px 20px; color:#111; background:#e7e7e7; font-size:.75rem; font-weight:900; letter-spacing:.28em; text-align:left; }
    .ban-card::after { content:"NO APPEAL"; display:block; padding:12px 20px; color:#fff; background:#b3132b; font-size:.7rem; font-weight:900; letter-spacing:.28em; text-align:right; }
    .content { padding:42px clamp(28px,7vw,76px) 36px; }
    .mark { width:112px; height:98px; margin:0 auto 28px; display:grid; place-items:center; color:#111; background:#e7e7e7; clip-path:polygon(50% 0,100% 100%,0 100%); font-size:4.2rem; font-weight:900; line-height:1; }
    .eyebrow { margin:0 0 14px; color:#ff5368; font-size:.82rem; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0 auto; max-width:100%; color:#fff; font-size:clamp(2.8rem,8vw,4rem); font-weight:1000; letter-spacing:-.08em; line-height:.9; text-transform:uppercase; overflow-wrap:break-word; }
    .message { margin:26px auto 0; max-width:510px; color:#e7e7e7; font-size:1.05rem; font-weight:700; line-height:1.55; }
    .message strong { color:#ff2b48; }
    .rule { height:12px; margin:32px 0 24px; background:repeating-linear-gradient(135deg,#d71935 0 16px,#0b0b0b 16px 32px); }
    .notice { margin:0; color:#aaa; font-size:.76rem; font-weight:800; line-height:1.7; letter-spacing:.08em; text-transform:uppercase; }
    .brand { margin-top:34px; color:#ff304c; font-size:.78rem; font-weight:900; letter-spacing:.3em; text-transform:uppercase; }
    @media (max-width:520px) { .ban-card { box-shadow:10px 10px 0 #560b16, 0 0 0 6px #050505; } .content { padding:34px 22px 28px; } }
  </style>
</head>
<body>
  <main class="ban-card" role="alert">
    <div class="content">
      <div class="mark" aria-hidden="true">!</div>
      <p class="eyebrow">Permanent access restriction</p>
      <h1>Unauthorized copy</h1>
      <p class="message">This device has been <strong>permanently banned</strong> from Dynamix.</p>
      <div class="rule"></div>
      <p class="notice">Access terminated · Account activity blocked · Do not retry</p>
      <div class="brand">Aerodynamix</div>
    </div>
  </main>
</body>
</html>
