<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps - Aerodynamix</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <script src="tab-cloak.js"></script>
    <script src="discs.js" defer></script>
    <script src="auth-overlay.js" defer></script>
</head>
<body>
    <nav>
        <img src="images/logo.gif" alt="logo" onclick="window.location='index.html'">
        <h1><span class="logo-a" id="logo-a">A</span>ERODYNAMIX</h1>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:0.4vw;">
            <a href="index.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Games</a>
            <a href="apps.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; background-color:#2c7ffc; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Apps</a>
            <a href="shop.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Shop</a>
            <a href="card-collection.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Card Collection</a>
            <a href="discs.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Discs</a>
            <a href="media-player.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Media Player</a>
            <a href="dynamix-connect.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Connect</a>
        </div>
        <a href="colors.html" style="margin-right:1.5vw; color:#fff; text-decoration:none; padding:0.55vw 1.3vw; background-color:#2c7ffc; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Settings</a>
    </nav>

    <main class="content" style="min-height:calc(100vh - 7vw); padding-top:8vw;">
        <h1 style="margin:0 0 1rem; color:#fff; font-size:2.8vw; text-align:center; letter-spacing:.12em; text-transform:uppercase;">Apps</h1>
        <div class="search">
            <input type="text" placeholder="Search apps..." aria-label="Search apps" disabled>
            <button type="button" disabled aria-label="Search apps"><i class="fas fa-search"></i></button>
        </div>
        <div id="apps" style="display:flex; justify-content:center; padding:5vw 1rem 10vw;">
            <p style="color:rgba(255,255,255,.58); font-size:1.1rem; text-align:center;">No apps available yet.</p>
        </div>
    </main>

    <div style="height:120px;"></div>
    <script src="music-player.js"></script>
    <script src="bubble-overlay.js"></script>
    <script src="snow-overlay.js"></script>
</body>
</html>
