services:
  - type: web
    name: aerodynamix
    env: python
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 2 --timeout 2100 -b 0.0.0.0:$PORT server:app"
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aerodynamix-db
          property: connectionString
      - key: DEMUCS_MODEL
        value: htdemucs_6s
      - key: DEMUCS_DEVICE
        value: cpu
      - key: DEMUCS_JOBS
        value: "0"
      - key: DEMUCS_SEGMENT
        value: "1"
      - key: DEMUCS_OVERLAP
        value: "0"
      - key: DEMUCS_SHIFTS
        value: "0"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"

databases:
  - name: aerodynamix-db
    plan: free
    ipAllowList: []
