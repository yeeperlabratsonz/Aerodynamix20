services:
  - type: web
    name: aerodynamix
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 4 -b 0.0.0.0:$PORT server:app"
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aerodynamix-db
          property: connectionString

databases:
  - name: aerodynamix-db
    plan: free
    ipAllowList: []
