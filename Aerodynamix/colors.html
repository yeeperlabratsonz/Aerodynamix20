<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Settings - Aerodynamix</title>
    <script src="auth-overlay.js" defer></script>
    <link rel="stylesheet" href="/main.css">
    <style>
        .settings-container {
            margin-top: 10vw;
            padding: 3vw;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 1vw;
        }

        .settings-container h2 {
            color: #fff;
            font-size: 2.5vw;
            margin-bottom: 2vw;
            text-align: center;
        }

        .theme-options {
            display: flex;
            flex-direction: column;
            gap: 1vw;
        }

        .theme-button {
            padding: 1.5vw;
            font-size: 1.5vw;
            border: 2px solid #fff;
            border-radius: 1vw;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .theme-button:hover {
            transform: scale(1.05);
        }

        .theme-button.black {
            background-color: #1b1b1b;
            color: #fff;
        }

        .theme-button.frutiger-aero {
            background: url('/images/frutiger-aero-btn-bg.png') center/cover no-repeat;
            color: #fff;
            border-color: rgba(255,255,255,0.8);
            text-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.3);
            font-weight: 800;
        }

        .theme-button.purple {
            background-color: #663399;
            color: #fff;
        }

        .theme-button.blue {
            background-color: #0000ff;
            color: #fff;
        }

        .theme-button.christmas {
            background-color: #c41e3a;
            color: #fff;
            border-color: #0d3b1e;
            font-weight: 800;
        }

        .theme-button.lite {
            background-color: #2ecc71;
            color: #fff;
            border-color: #27ae60;
            font-weight: 800;
        }
        .theme-button.lite.active {
            background-color: #e74c3c;
            border-color: #c0392b;
        }

        .back-button {
            display: inline-block;
            margin-top: 2vw;
            padding: 1vw 2vw;
            background-color: #2c7ffc;
            color: #fff;
            text-decoration: none;
            border-radius: 0.5vw;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .back-button:hover {
            background-color: #1e5bc4;
        }
    </style>
</head>
<body>
    <nav>
        <img src="/images/logo.gif" alt="logo" onclick="window.location='/'">
        <h1><span class="logo-a" id="logo-a">A</span>ERODYNAMIX</h1>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:0.4vw;">
            <a href="/" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Games</a>
            <a href="/media-player.html" style="color:#fff; text-decoration:none; padding:0.55vw 1.3vw; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Media Player</a>
        </div>
        <a href="/colors.html" style="margin-right:1.5vw; color:#fff; text-decoration:none; padding:0.55vw 1.3vw; background-color:#2c7ffc; border-radius:0.5vw; font-weight:600; font-size:0.95vw; transition:all 0.3s ease;">Settings</a>
    </nav>

    <div id="trial-blur-overlay" style="display:none; position:fixed; top:7vw; left:0; width:100%; height:calc(100% - 7vw); backdrop-filter:blur(12px) saturate(120%); background:rgba(0,0,0,0.55); z-index:9998; align-items:center; justify-content:center;">
        <div style="text-align:center; color:#fff; font-family:'Montserrat',sans-serif; padding:2rem;">
            <h2 style="font-size:2.2rem; margin-bottom:1rem; text-shadow:0 0 20px rgba(255,255,255,0.3);">Settings and Customization aren't available on the free trial version of Aerodynamix</h2>
            <p style="font-size:1rem; color:#ccc;">Sorry for the inconvenience</p>
        </div>
    </div>

    <div class="content">
        <div class="settings-container">
            <h2>Choose Theme</h2>
            <div class="theme-options">
                <button class="theme-button black" onclick="setTheme('black')">Black</button>
                <button class="theme-button frutiger-aero" onclick="setTheme('frutiger-aero')">Frutiger Aero</button>
                <button class="theme-button purple" onclick="setTheme('purple')">Midnight Purple</button>
                <button class="theme-button blue" onclick="setTheme('blue')">Genesis Blue</button>
                <button class="theme-button christmas" onclick="setTheme('christmas')">Christmas</button>
            </div>
            <h2 style="margin-top: 2.5vw;">Performance</h2>
            <button id="lite-mode-btn" class="theme-button lite" onclick="toggleLiteMode()">Lite Mode</button>
            <p id="lite-status" style="text-align:center; font-size:0.9rem; color:#aaa; margin-top:0.5vw;">Disables animations, particle effects, and heavy visual effects</p>
            <button onclick="enableTabCloak()" class="back-button" style="background-color: #e74c3c; margin-top: 2vw;">Tab Cloak</button>
            <a href="/" class="back-button">Back to Home</a>
        </div>
    </div>

    <script>
        function setTheme(theme) {
            localStorage.setItem('aerodynamixTheme', theme);
            applyTheme(theme);
        }

        function toggleLiteMode() {
            const current = localStorage.getItem('aerodynamixLite') === 'true';
            const next = !current;
            localStorage.setItem('aerodynamixLite', next ? 'true' : 'false');
            applyLiteMode(next);
            // Broadcast to all overlays on this tab so they react immediately
            window.dispatchEvent(new CustomEvent('aerodynamixLiteChanged', { detail: { enabled: next } }));
        }

        function applyLiteMode(enabled) {
            const btn = document.getElementById('lite-mode-btn');
            const status = document.getElementById('lite-status');
            if (!btn || !status) return;
            if (enabled) {
                btn.classList.add('active');
                btn.textContent = 'Lite Mode: ON';
                status.textContent = 'Lite Mode is active. Animations, particle effects, and heavy visual effects are disabled.';
                status.style.color = '#2ecc71';
                document.body.classList.add('lite-mode');
            } else {
                btn.classList.remove('active');
                btn.textContent = 'Lite Mode';
                status.textContent = 'Disables animations, particle effects, and heavy visual effects';
                status.style.color = '#aaa';
                document.body.classList.remove('lite-mode');
            }
        }

        function applyTheme(theme) {
            const body = document.body;
            const content = document.querySelector('.content');
            const searchInput = document.querySelector('.search input');
            const searchButton = document.querySelector('.search button');
            const settingsButton = document.querySelector('nav a[href="/colors.html"]');
            const gameImgs = document.querySelectorAll('#games img');
            const h1Elements = document.querySelectorAll('h1');

            // Reset styles that not every theme branch sets, so switching themes never leaves leftovers
            body.style.backgroundImage = 'none';
            body.style.backgroundAttachment = '';
            body.style.backgroundSize = '';
            body.style.backgroundRepeat = '';
            if (searchInput) { searchInput.style.border = ''; searchInput.style.boxShadow = ''; searchInput.style.backdropFilter = ''; }
            if (searchButton) { searchButton.style.background = ''; searchButton.style.border = ''; searchButton.style.boxShadow = ''; searchButton.style.backdropFilter = ''; }
            if (settingsButton) { settingsButton.style.background = ''; settingsButton.style.boxShadow = ''; settingsButton.style.backdropFilter = ''; }

            if (theme === 'black') {
                const premium = sessionStorage.getItem('authorized') === 'true';
                if (premium) {
                    body.style.backgroundColor = '#030509';
                    body.style.backgroundImage = 'radial-gradient(ellipse at 50% 130%, rgba(44,127,252,0.32) 0%, rgba(44,127,252,0.08) 40%, transparent 65%), radial-gradient(ellipse at 20% 0%, rgba(44,127,252,0.10) 0%, transparent 35%)';
                    body.style.backgroundSize = 'cover';
                    body.style.backgroundAttachment = 'fixed';
                    body.style.backgroundRepeat = 'no-repeat';
                    body.style.color = '#fff';
                    if (searchInput) {
                        searchInput.style.backgroundColor = 'rgba(255,255,255,0.05)';
                        searchInput.style.color = '#fff';
                        searchInput.style.border = '1px solid rgba(44,127,252,0.3)';
                        searchInput.style.boxShadow = '0 0 0 1px rgba(44,127,252,0.15), 0 8px 24px rgba(0,0,0,0.3)';
                    }
                    if (searchButton) {
                        searchButton.style.background = 'linear-gradient(135deg, #2c7ffc 0%, #1a5fd0 100%)';
                        searchButton.style.color = '#fff';
                        searchButton.style.border = 'none';
                        searchButton.style.boxShadow = '0 6px 24px rgba(44,127,252,0.45), 0 0 0 1px rgba(44,127,252,0.2)';
                    }
                    if (settingsButton) {
                        settingsButton.style.background = 'linear-gradient(135deg, #2c7ffc 0%, #1a5fd0 100%)';
                        settingsButton.style.color = '#fff';
                        settingsButton.style.boxShadow = '0 6px 24px rgba(44,127,252,0.4), 0 0 0 1px rgba(44,127,252,0.2)';
                    }
                    document.querySelectorAll('#games img').forEach(img => {
                        img.onmouseenter = () => { img.style.boxShadow = '0 12px 40px rgba(44,127,252,0.45), 0 0 0 1px rgba(44,127,252,0.25)'; img.style.transform = 'scale(1.03)'; };
                        img.onmouseleave = () => { img.style.boxShadow = ''; img.style.transform = ''; };
                    });
                } else {
                    body.style.backgroundColor = '#1b1b1b';
                    body.style.backgroundImage = 'none';
                    body.style.color = '#fff';
                    if (searchInput) {
                        searchInput.style.backgroundColor = '#222222';
                        searchInput.style.color = '#fff';
                    }
                    if (searchButton) {
                        searchButton.style.backgroundColor = '#fff';
                        searchButton.style.color = '#222222';
                    }
                    if (settingsButton) {
                        settingsButton.style.backgroundColor = '#2c7ffc';
                        settingsButton.style.color = '#fff';
                    }
                }
                h1Elements.forEach(h => h.style.color = '#fff');
            } else if (theme === 'frutiger-aero') {
                body.style.backgroundColor = '#87CEEB';
                body.style.backgroundImage = "url('/images/frutiger-aero-bg.jpg')";
                body.style.backgroundSize = 'cover';
                body.style.backgroundPosition = 'center';
                body.style.backgroundAttachment = 'fixed';
                body.style.backgroundRepeat = 'no-repeat';
                body.style.color = '#002244';
                if (searchInput) {
                    searchInput.style.backgroundColor = 'rgba(255,255,255,0.55)';
                    searchInput.style.color = '#002244';
                    searchInput.style.border = '1px solid rgba(255,255,255,0.5)';
                    searchInput.style.backdropFilter = 'blur(12px)';
                    searchInput.style.boxShadow = '0 4px 16px rgba(0,34,68,0.12)';
                }
                if (searchButton) {
                    searchButton.style.background = 'linear-gradient(135deg, rgba(0,70,140,0.75) 0%, rgba(0,40,90,0.85) 100%)';
                    searchButton.style.color = '#fff';
                    searchButton.style.border = '1px solid rgba(255,255,255,0.25)';
                    searchButton.style.backdropFilter = 'blur(12px)';
                    searchButton.style.boxShadow = '0 8px 24px rgba(0,40,90,0.3)';
                }
                if (settingsButton) {
                    settingsButton.style.background = 'linear-gradient(135deg, rgba(0,70,140,0.75) 0%, rgba(0,40,90,0.85) 100%)';
                    settingsButton.style.color = '#fff';
                    settingsButton.style.border = '1px solid rgba(255,255,255,0.25)';
                    settingsButton.style.backdropFilter = 'blur(12px)';
                    settingsButton.style.boxShadow = '0 8px 24px rgba(0,40,90,0.3)';
                }
                h1Elements.forEach(h => h.style.color = '#002244');
            } else if (theme === 'purple') {
                body.style.backgroundColor = '#180826';
                body.style.backgroundImage = 'radial-gradient(ellipse at 50% 130%, rgba(160,80,255,0.42) 0%, rgba(140,50,255,0.12) 45%, transparent 65%), radial-gradient(ellipse at 80% 0%, rgba(200,100,255,0.18) 0%, transparent 35%)';
                body.style.backgroundSize = 'cover';
                body.style.backgroundAttachment = 'fixed';
                body.style.backgroundRepeat = 'no-repeat';
                body.style.color = '#f0e0ff';
                if (searchInput) {
                    searchInput.style.backgroundColor = 'rgba(255,255,255,0.05)';
                    searchInput.style.color = '#f0e0ff';
                    searchInput.style.border = '1px solid rgba(160,80,255,0.55)';
                    searchInput.style.boxShadow = '0 0 0 1px rgba(160,80,255,0.2), 0 8px 24px rgba(160,80,255,0.12)';
                }
                if (searchButton) {
                    searchButton.style.background = 'linear-gradient(135deg, #9333ea 0%, #6b21a8 100%)';
                    searchButton.style.color = '#fff';
                    searchButton.style.border = 'none';
                    searchButton.style.boxShadow = '0 8px 28px rgba(147,51,234,0.45), 0 0 0 1px rgba(147,51,234,0.25)';
                }
                if (settingsButton) {
                    settingsButton.style.background = 'linear-gradient(135deg, #9333ea 0%, #6b21a8 100%)';
                    settingsButton.style.color = '#fff';
                    settingsButton.style.boxShadow = '0 8px 28px rgba(147,51,234,0.4), 0 0 0 1px rgba(147,51,234,0.25)';
                }
                h1Elements.forEach(h => h.style.color = '#f0e0ff');
            } else if (theme === 'blue') {
                body.style.backgroundColor = '#040d24';
                body.style.backgroundImage = 'radial-gradient(ellipse at 50% 130%, rgba(59,130,246,0.45) 0%, rgba(44,127,252,0.12) 45%, transparent 65%), radial-gradient(ellipse at 20% 0%, rgba(96,165,250,0.18) 0%, transparent 35%)';
                body.style.backgroundSize = 'cover';
                body.style.backgroundAttachment = 'fixed';
                body.style.backgroundRepeat = 'no-repeat';
                body.style.color = '#e0f0ff';
                if (searchInput) {
                    searchInput.style.backgroundColor = 'rgba(255,255,255,0.05)';
                    searchInput.style.color = '#e0f0ff';
                    searchInput.style.border = '1px solid rgba(59,130,246,0.55)';
                    searchInput.style.boxShadow = '0 0 0 1px rgba(59,130,246,0.2), 0 8px 24px rgba(59,130,246,0.12)';
                }
                if (searchButton) {
                    searchButton.style.background = 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)';
                    searchButton.style.color = '#fff';
                    searchButton.style.border = 'none';
                    searchButton.style.boxShadow = '0 8px 28px rgba(59,130,246,0.45), 0 0 0 1px rgba(59,130,246,0.25)';
                }
                if (settingsButton) {
                    settingsButton.style.background = 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)';
                    settingsButton.style.color = '#fff';
                    settingsButton.style.boxShadow = '0 8px 28px rgba(59,130,246,0.4), 0 0 0 1px rgba(59,130,246,0.25)';
                }
                h1Elements.forEach(h => h.style.color = '#e0f0ff');
            } else if (theme === 'christmas') {
                body.style.backgroundColor = '#0a180d';
                body.style.backgroundImage = 'radial-gradient(ellipse at 50% 120%, rgba(180,40,40,0.15) 0%, transparent 55%)';
                body.style.backgroundSize = 'cover';
                body.style.backgroundAttachment = 'fixed';
                body.style.backgroundRepeat = 'no-repeat';
                body.style.color = '#fcebd4';
                if (searchInput) {
                    searchInput.style.backgroundColor = 'rgba(255,255,255,0.05)';
                    searchInput.style.color = '#fcebd4';
                    searchInput.style.border = '1px solid rgba(255,215,0,0.25)';
                    searchInput.style.boxShadow = '0 4px 16px rgba(180,40,40,0.1)';
                }
                if (searchButton) {
                    searchButton.style.background = 'linear-gradient(135deg, #b92e40 0%, #8a1c28 100%)';
                    searchButton.style.color = '#fff';
                    searchButton.style.border = 'none';
                    searchButton.style.boxShadow = '0 6px 20px rgba(185,46,64,0.35)';
                }
                if (settingsButton) {
                    settingsButton.style.background = 'linear-gradient(135deg, #b92e40 0%, #8a1c28 100%)';
                    settingsButton.style.color = '#fff';
                    settingsButton.style.boxShadow = '0 6px 20px rgba(185,46,64,0.3)';
                }
                h1Elements.forEach(h => h.style.color = '#fcebd4');
            }
            // Santa hat on the A
            const logoA = document.getElementById('logo-a');
            if (logoA) logoA.classList.toggle('santa', theme === 'christmas');
        }

        // Load saved theme and lite mode on page load
        var isTrial = sessionStorage.getItem('authorized') !== 'true';
        var savedTheme = isTrial ? 'black' : (localStorage.getItem('aerodynamixTheme') || 'black');
        applyTheme(savedTheme);
        applyLiteMode(localStorage.getItem('aerodynamixLite') === 'true');

        (function() {
            const blurOverlay = document.getElementById('trial-blur-overlay');
            const isAuthorized = sessionStorage.getItem('authorized') === 'true';
            const trialStart = sessionStorage.getItem('trial_start');
            const trialUsed = sessionStorage.getItem('trial_used') === 'true';

            // Lock out used trials and active trials in this session; auth-overlay.js provides the timer
            if (!isAuthorized && (trialUsed || trialStart)) {
                blurOverlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                document.querySelectorAll('.theme-button, .back-button').forEach(el => {
                    el.style.pointerEvents = 'none';
                });
            }
        })();

        function enableTabCloak() {
            // Change the page title to Google
            document.title = 'Google';
            
            // Change the favicon to Google's favicon
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/x-icon';
            link.href = 'https://www.google.com/favicon.ico';
            document.head.appendChild(link);
            
            // Change the URL to about:blank
            window.history.pushState(null, 'Google', 'about:blank');
        }
    </script>
    <div style="height: 120px;"></div>
    <script src="music-player.js"></script>
    <script src="script.js"></script>
    <script src="bubble-overlay.js"></script>
    <script src="snow-overlay.js"></script>
</body>
</html>
